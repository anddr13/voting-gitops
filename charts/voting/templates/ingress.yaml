{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: voting
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - {{- with .Values.ingress.host }}
      host: {{ . }}
      {{- end }}
      http:
        paths:
          - path: /api/vote
            pathType: Prefix
            backend:
              service:
                name: vote-api
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: result-api
                port:
                  name: http
{{- end }}
