image:
  registry: ghcr.io/anddr13
  # Bumped by the voting-app CI on every merge to main.
  tag: 054ac8e093a4c818e01370090f827c2cf3b830ce

cloudName: local
voteOptions: cat,dog

kafka:
  brokers: voting-kafka-bootstrap:9092
  topic: votes
  groupId: vote-workers
redis:
  url: redis://redis:6379
# The CloudNativePG cluster from charts/data. Each service picks a role with `postgres: rw|ro`.
postgres:
  rwHost: voting-pg-rw
  roHost: voting-pg-ro
  database: voting
  # Created by CloudNativePG: username and password of the database owner.
  secret: voting-pg-app

# A PodMonitor for the services with /metrics; only where the Prometheus Operator runs.
metrics:
  podMonitor: false
  services: [worker]

ingress:
  enabled: true
  className: traefik
  # Empty = answer on any host, i.e. on the bare load balancer address.
  host: ""

services:
  vote-api:
    http: true
    replicas: 2
    env:
      RATE_LIMIT_SECONDS: "3"
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { memory: 512Mi }

  result-api:
    http: true
    replicas: 2
    # Results tolerate a little staleness, so they are read from the replicas.
    postgres: ro
    env: {}
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { memory: 384Mi }

  worker:
    http: false
    replicas: 1
    postgres: rw
    env:
      # Slows each message down so a k6 run builds lag and KEDA has something to scale on.
      PROCESSING_DELAY_MS: "20"
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { memory: 512Mi }
    autoscaling:
      enabled: true
      minReplicas: 1
      # More consumers than partitions would sit idle.
      maxReplicas: 6
      lagThreshold: 50
