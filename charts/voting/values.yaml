image:
  registry: ghcr.io/anddr13
  # Bumped by the voting-app CI on every merge to main.
  tag: 129fe93106f17bf753194f8634a5460d5a1e2ef0

cloudName: local
voteOptions: cat,dog

kafka:
  brokers: voting-kafka-bootstrap:9092
  topic: votes
  groupId: vote-workers
redis:
  url: redis://redis:6379
mongo:
  url: mongodb://mongo:27017/?directConnection=true

ingress:
  enabled: true
  className: traefik
  # Empty = answer on any host, i.e. on the bare load balancer address.
  host: ""

services:
  vote-api:
    http: true
    replicas: 2
    env:
      RATE_LIMIT_SECONDS: "3"
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { memory: 512Mi }

  result-api:
    http: true
    replicas: 2
    env: {}
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { memory: 384Mi }

  worker:
    http: false
    replicas: 1
    env:
      # Slows each message down so a k6 run builds lag and KEDA has something to scale on.
      PROCESSING_DELAY_MS: "20"
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { memory: 512Mi }
    autoscaling:
      enabled: true
      minReplicas: 1
      # More consumers than partitions would sit idle.
      maxReplicas: 6
      lagThreshold: 50
