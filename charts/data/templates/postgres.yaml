# PostgreSQL managed by CloudNativePG. It creates the Services the app uses:
#   <name>-rw  the primary (writes: the worker, migrations)
#   <name>-ro  the replicas only (reads: result-api)
# and the Secret <name>-app with the owner's credentials.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Values.postgres.name }}
spec:
  instances: {{ .Values.postgres.instances }}
  {{- with .Values.postgres.imageName }}
  imageName: {{ . }}
  {{- end }}
  bootstrap:
    initdb:
      database: {{ .Values.postgres.database }}
      owner: {{ .Values.postgres.owner }}
  # The metrics exporter connects as an ordinary role. When the application uses up max_connections,
  # it would be locked out too, and the instance would vanish from monitoring exactly when it matters.
  # reserved_connections (in parameters) keeps slots for members of pg_use_reserved_connections.
  managed:
    roles:
      - name: cnpg_metrics_exporter
        ensure: present
        login: true
        inRoles: [pg_monitor, pg_use_reserved_connections]
  postgresql:
    parameters:
      {{- range $key, $value := .Values.postgres.parameters }}
      {{ $key }}: {{ $value | quote }}
      {{- end }}
  storage:
    size: {{ .Values.postgres.storageSize }}
    {{- with .Values.storageClass }}
    storageClass: {{ . }}
    {{- end }}
  resources:
    {{- toYaml .Values.postgres.resources | nindent 4 }}
