# KRaft cluster of kafka.nodes nodes, each both controller and broker.
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual-role
  labels:
    strimzi.io/cluster: {{ .Values.kafka.name }}
spec:
  replicas: {{ .Values.kafka.nodes }}
  roles:
    - controller
    - broker
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: {{ .Values.kafka.storageSize }}
        kraftMetadata: shared
        deleteClaim: true
        {{- with .Values.storageClass }}
        class: {{ . }}
        {{- end }}
  resources:
    {{- toYaml .Values.kafka.resources | nindent 4 }}
  jvmOptions:
    -Xms: {{ .Values.kafka.heap }}
    -Xmx: {{ .Values.kafka.heap }}
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: {{ .Values.kafka.name }}
spec:
  kafka:
    version: {{ .Values.kafka.version }}
    metadataVersion: {{ .Values.kafka.metadataVersion }}
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      offsets.topic.replication.factor: {{ .Values.kafka.replicationFactor }}
      transaction.state.log.replication.factor: {{ .Values.kafka.replicationFactor }}
      transaction.state.log.min.isr: {{ .Values.kafka.minInsyncReplicas }}
      default.replication.factor: {{ .Values.kafka.replicationFactor }}
      min.insync.replicas: {{ .Values.kafka.minInsyncReplicas }}
      # Topics are declared as KafkaTopic resources below, nothing appears by accident.
      auto.create.topics.enable: false
  entityOperator:
    topicOperator:
      resources:
        requests: { cpu: 50m, memory: 256Mi }
        limits: { memory: 384Mi }
  {{- if .Values.monitoring.enabled }}
  # Topic, partition (incl. under-replicated) and consumer group lag metrics.
  kafkaExporter:
    resources:
      requests: { cpu: 20m, memory: 64Mi }
      limits: { memory: 128Mi }
  {{- end }}
{{- range $name, $topic := .Values.topics }}
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: {{ $name }}
  labels:
    strimzi.io/cluster: {{ $.Values.kafka.name }}
spec:
  partitions: {{ $topic.partitions }}
  replicas: {{ $.Values.kafka.replicationFactor }}
  config:
    retention.ms: {{ $topic.retentionMs }}
{{- end }}
