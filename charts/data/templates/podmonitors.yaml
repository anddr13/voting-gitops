{{- if .Values.monitoring.enabled }}
# CloudNativePG's own PodMonitor switch is deprecated; its docs suggest a manual one like this.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ .Values.postgres.name }}
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: {{ .Values.postgres.name }}
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ .Values.kafka.name }}-kafka-exporter
spec:
  selector:
    matchLabels:
      strimzi.io/name: {{ .Values.kafka.name }}-kafka-exporter
  podMetricsEndpoints:
    - port: tcp-prometheus
{{- end }}
