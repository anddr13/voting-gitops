# kind follows the lab branch: the ai-sre-agent chaos scenarios commit breakages and their reverts there,
# so main and the clouds never see them.
gitops:
  targetRevision: lab

applications:
  traefik:
    values:
      service:
        spec:
          # kind has no cloud load balancer: voting-infra-local maps this NodePort to localhost:8090.
          type: NodePort
      ports:
        web:
          nodePort: 30080
      providers:
        kubernetesIngress:
          # A NodePort Service has no address to copy into Ingress status, and Argo CD reports
          # an Ingress without one as Progressing forever. Publish localhost instead.
          publishedService:
            enabled: false
          ingressEndpoint:
            ip: 127.0.0.1
      # Request rates and status codes per Service: the source of the 5xx alert.
      metrics:
        prometheus:
          # The default buckets start at 0.1 s: every quantile of a fast service then reads ~0.099 s.
          buckets: "0.005,0.01,0.025,0.05,0.1,0.25,0.5,1,2.5,5"
          service:
            enabled: true
          serviceMonitor:
            enabled: true
          # Render the ServiceMonitor even before kube-prometheus-stack (same wave) has added the CRD;
          # the sync retries until it exists.
          disableAPICheck: true
    skipDryRunOnMissingResource: true
  data:
    values:
      monitoring:
        enabled: true
      kafka:
        nodes: 3
        replicationFactor: 3
        minInsyncReplicas: 2
  voting:
    values:
      cloudName: kind
      metrics:
        podMonitor: true

  # Monitoring for the ai-sre-agent stand, sized for a 12 GB Docker VM. Wave 0, so the ServiceMonitor
  # and PrometheusRule CRDs exist before data and voting.
  kube-prometheus-stack:
    wave: 0
    namespace: monitoring
    # The CRDs are too large for client-side apply.
    serverSideApply: true
    chart:
      repoURL: https://prometheus-community.github.io/helm-charts
      name: kube-prometheus-stack
      version: 92.16.1
    values:
      fullnameOverride: kps
      # kind runs etcd, the scheduler, the controller manager and kube-proxy bound to localhost:
      # their targets would always be down and fire alerts that are not part of any scenario.
      kubeEtcd: { enabled: false }
      kubeControllerManager: { enabled: false }
      kubeScheduler: { enabled: false }
      kubeProxy: { enabled: false }
      defaultRules:
        rules:
          etcd: false
          kubeControllerManager: false
          kubeSchedulerAlerting: false
          kubeSchedulerRecording: false
          kubeProxy: false
          windows: false
      prometheus:
        prometheusSpec:
          retention: 2d
          retentionSize: 4GB
          # Pick up ServiceMonitors, PodMonitors and PrometheusRules from every namespace,
          # not only the ones labelled with this release.
          serviceMonitorSelectorNilUsesHelmValues: false
          podMonitorSelectorNilUsesHelmValues: false
          ruleSelectorNilUsesHelmValues: false
          probeSelectorNilUsesHelmValues: false
          scrapeConfigSelectorNilUsesHelmValues: false
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { memory: 1536Mi }
          storageSpec:
            volumeClaimTemplate:
              spec:
                accessModes: [ReadWriteOnce]
                resources:
                  requests:
                    storage: 5Gi
      alertmanager:
        # The voting alerts (charts/alerts, label stand=voting) go to the ai-sre-agent webhook;
        # everything else from the default rules stays in Alertmanager's UI only.
        config:
          route:
            receiver: "null"
            group_by: [alertname, namespace]
            group_wait: 30s
            group_interval: 5m
            repeat_interval: 4h
            routes:
              - receiver: ai-sre-agent
                matchers: ['stand="voting"']
          receivers:
            - name: "null"
            - name: ai-sre-agent
              webhook_configs:
                - url: http://ai-sre-agent.ai-sre-agent.svc:8080/alertmanager
                  send_resolved: true
        alertmanagerSpec:
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
      prometheusOperator:
        resources:
          requests: { cpu: 20m, memory: 64Mi }
          limits: { memory: 192Mi }
      kube-state-metrics:
        resources:
          requests: { cpu: 10m, memory: 48Mi }
          limits: { memory: 128Mi }
      prometheus-node-exporter:
        # Docker Desktop's root mount is not shared, and node-exporter refuses to start with it.
        hostRootFsMount:
          enabled: false
        resources:
          requests: { cpu: 10m, memory: 24Mi }
          limits: { memory: 64Mi }
      grafana:
        # Local only: anonymous admin and no login form. No admin user either: otherwise the chart
        # generates a random password on every render (Argo CD has no lookup), and the Secret and
        # the pod's checksum annotation would be OutOfSync after every sync.
        env:
          GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"
        grafana.ini:
          auth:
            disable_login_form: true
          auth.anonymous:
            enabled: true
            org_role: Admin
        ingress:
          enabled: true
          ingressClassName: traefik
          hosts: [grafana.localhost]
        additionalDataSources:
          - name: Loki
            type: loki
            uid: loki
            access: proxy
            url: http://loki.monitoring.svc:3100
        resources:
          requests: { cpu: 20m, memory: 128Mi }
          limits: { memory: 384Mi }
        sidecar:
          resources:
            requests: { cpu: 5m, memory: 48Mi }
            limits: { memory: 128Mi }

  loki:
    wave: 0
    namespace: monitoring
    chart:
      repoURL: https://grafana.github.io/helm-charts
      name: loki
      version: 7.5.0
    values:
      deploymentMode: SingleBinary
      loki:
        auth_enabled: false
        commonConfig:
          replication_factor: 1
        storage:
          type: filesystem
        schemaConfig:
          configs:
            - from: "2024-04-01"
              store: tsdb
              object_store: filesystem
              schema: v13
              index:
                prefix: loki_index_
                period: 24h
        limits_config:
          retention_period: 48h
        compactor:
          retention_enabled: true
          delete_request_store: filesystem
      singleBinary:
        replicas: 1
        persistence:
          size: 5Gi
        resources:
          requests: { cpu: 50m, memory: 192Mi }
          limits: { memory: 512Mi }
      # The chart defaults are a scalable install: object storage, memcached caches (over 1 GB),
      # a gateway, a canary and a rules sidecar. None of it is needed on one node.
      read: { replicas: 0 }
      write: { replicas: 0 }
      backend: { replicas: 0 }
      gateway: { enabled: false }
      chunksCache: { enabled: false }
      resultsCache: { enabled: false }
      minio: { enabled: false }
      lokiCanary: { enabled: false }
      test: { enabled: false }
      sidecar:
        rules:
          enabled: false

  alloy:
    wave: 0
    namespace: monitoring
    chart:
      repoURL: https://grafana.github.io/helm-charts
      name: alloy
      version: 1.15.0
    values:
      # Logs are tailed through the Kubernetes API, so one replica is enough and needs no host mounts.
      controller:
        type: deployment
        replicas: 1
      alloy:
        resources:
          requests: { cpu: 20m, memory: 96Mi }
          limits: { memory: 256Mi }
        configMap:
          content: |
            discovery.kubernetes "pods" {
              role = "pod"
            }

            discovery.relabel "pods" {
              targets = discovery.kubernetes.pods.targets
              rule {
                source_labels = ["__meta_kubernetes_namespace"]
                target_label  = "namespace"
              }
              rule {
                source_labels = ["__meta_kubernetes_pod_name"]
                target_label  = "pod"
              }
              rule {
                source_labels = ["__meta_kubernetes_pod_container_name"]
                target_label  = "container"
              }
              rule {
                source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
                target_label  = "app"
              }
            }

            loki.source.kubernetes "pods" {
              targets    = discovery.relabel.pods.output
              forward_to = [loki.write.default.receiver]
            }

            loki.write "default" {
              endpoint {
                url = "http://loki.monitoring.svc:3100/loki/api/v1/push"
              }
            }

  # One alert per ai-sre-agent scenario. Wave 1: the PrometheusRule CRD comes with kube-prometheus-stack.
  alerts:
    wave: 1
    namespace: monitoring
    path: charts/alerts

  # The agent's read-only ServiceAccount and ClusterRole, from the ai-sre-agent repository.
  ai-sre-agent:
    wave: 0
    namespace: ai-sre-agent
    git:
      repoURL: https://github.com/anddr13/ai-sre-agent.git
      targetRevision: main
      path: deploy
